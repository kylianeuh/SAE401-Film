<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinéFlic — Le Tinder des Films</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#13131c;--bg3:#1c1c2a;
  --gold:#c9a84c;--gold2:#e8c96d;
  --text:#f0ead8;--muted:#8a8478;
  --yes:#3dbd7a;--no:#e05252;
  --card-w:360px;--card-h:520px;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.35}

header{width:100%;padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d}
.logo{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;color:var(--gold);letter-spacing:.02em}
.logo span{color:var(--text);font-weight:400}
.header-right{display:flex;align-items:center;gap:.8rem}
.liked-badge{background:var(--bg3);border:1px solid #ffffff14;border-radius:2rem;padding:.3rem .9rem;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.5rem}
.liked-badge strong{color:var(--gold);font-size:.95rem}
.btn-csv{background:var(--gold);color:#1a1408;border:none;border-radius:2rem;padding:.4rem 1rem;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;transition:background .2s,transform .1s}
.btn-csv:hover{background:var(--gold2)}.btn-csv:active{transform:scale(.97)}.btn-csv:disabled{opacity:.35;cursor:not-allowed}

/* SETUP */
#setup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:2rem;max-width:460px;margin:0 auto}
#setup h1{font-family:'Playfair Display',serif;font-size:2.5rem;font-weight:900;text-align:center;line-height:1.1}
#setup h1 em{font-style:italic;color:var(--gold)}
#setup>p{color:var(--muted);text-align:center;line-height:1.7;font-size:.9rem}
.setup-box{background:var(--bg2);border:1px solid #ffffff12;border-radius:16px;padding:1.75rem;width:100%;display:flex;flex-direction:column;gap:1.1rem}
.field label{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.45rem}
.field input,.field select{width:100%;background:var(--bg3);border:1px solid #ffffff14;border-radius:10px;padding:.7rem .9rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.92rem;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--gold)}
.field select option{background:var(--bg3)}
.vote-row{display:flex;align-items:center;gap:1rem}
.vote-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--bg3);border:none;padding:0;cursor:pointer}
.vote-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);border:none;cursor:pointer}
.vote-val{min-width:55px;text-align:right;font-size:.88rem;font-weight:500;color:var(--gold)}
.btn-test{width:100%;padding:.7rem;background:transparent;color:var(--muted);border:1px solid #ffffff18;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.88rem;cursor:pointer;transition:border-color .2s,color .2s}
.btn-test:hover{border-color:var(--gold);color:var(--gold)}
.btn-start{width:100%;padding:.85rem;background:var(--gold);color:#1a1408;border:none;border-radius:10px;font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;cursor:pointer;letter-spacing:.02em;transition:background .2s,transform .1s}
.btn-start:hover{background:var(--gold2)}.btn-start:active{transform:scale(.98)}
#test-result{font-size:.8rem;border-radius:8px;padding:.6rem .9rem;line-height:1.6;display:none}
#test-result.ok{background:#3dbd7a18;border:1px solid #3dbd7a44;color:#3dbd7a}
#test-result.err{background:#e0525218;border:1px solid #e0525244;color:#e05252}
.hint{font-size:.72rem;color:var(--muted);text-align:center}
.hint a{color:var(--gold)}

/* APP */
#app{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;gap:1.8rem}
.card-stage{position:relative;width:var(--card-w);height:var(--card-h)}
.movie-card{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--bg2);border:1px solid #ffffff0f;user-select:none;box-shadow:0 24px 60px #00000066}
.card-bg{position:absolute;inset:0;background-size:cover;background-position:center top;filter:brightness(.45)}
.card-fade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 28%,#0a0a0f88 52%,#0a0a0fee 72%,#0a0a0f 100%)}
.card-body{position:absolute;bottom:0;left:0;right:0;padding:1.4rem}
.card-genres{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.65rem}
.genre-tag{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:#c9a84c18;border:1px solid #c9a84c33;border-radius:2rem;padding:.18rem .55rem}
.card-title{font-family:'Playfair Display',serif;font-size:1.55rem;font-weight:700;line-height:1.15;margin-bottom:.28rem}
.card-meta{display:flex;align-items:center;gap:.65rem;margin-bottom:.65rem;font-size:.78rem;color:var(--muted)}
.card-meta .star{color:var(--gold)}
.card-overview{font-size:.78rem;line-height:1.6;color:#c4bdb0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vote-overlay{position:absolute;top:1.4rem;padding:.35rem .9rem;border-radius:.4rem;font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;letter-spacing:.1em;border:3px solid;opacity:0;pointer-events:none;transition:opacity .12s}
.vote-overlay.yes{left:1.4rem;color:var(--yes);border-color:var(--yes);transform:rotate(-8deg)}
.vote-overlay.no{right:1.4rem;color:var(--no);border-color:var(--no);transform:rotate(8deg)}
#card-status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:280px;font-size:.88rem;line-height:1.7;color:var(--muted)}

.action-row{display:flex;align-items:center;gap:1.5rem}
.btn-vote{display:flex;flex-direction:column;align-items:center;gap:.35rem;background:none;border:none;cursor:pointer;transition:transform .1s}
.btn-vote:active{transform:scale(.92)}
.vote-circle{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;transition:background .2s,box-shadow .2s}
.btn-vote.no .vote-circle{background:#e0525218;border:2px solid #e0525244;color:var(--no)}
.btn-vote.yes .vote-circle{background:#3dbd7a18;border:2px solid #3dbd7a44;color:var(--yes)}
.btn-vote.no:hover .vote-circle{background:#e0525230;box-shadow:0 0 24px #e0525228}
.btn-vote.yes:hover .vote-circle{background:#3dbd7a30;box-shadow:0 0 24px #3dbd7a28}
.vote-label{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.key-hint{font-size:.68rem;color:#ffffff20;letter-spacing:.05em}
.progress-line{font-size:.73rem;color:var(--muted);text-align:center}

@keyframes fly-left{from{transform:translateX(0) rotate(0);opacity:1}to{transform:translateX(-150%) rotate(-22deg);opacity:0}}
@keyframes fly-right{from{transform:translateX(0) rotate(0);opacity:1}to{transform:translateX(150%) rotate(22deg);opacity:0}}
@keyframes pop-in{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.anim-fly-left{animation:fly-left .32s ease-in forwards}
.anim-fly-right{animation:fly-right .32s ease-in forwards}
.anim-pop-in{animation:pop-in .28s cubic-bezier(.34,1.56,.64,1) both}
</style>
</head>
<body>

<header>
  <div class="logo">Ciné<span>Flic</span></div>
  <div class="header-right">
    <div class="liked-badge">❤️ <strong id="liked-count">0</strong> aimé(s)</div>
    <button class="btn-csv" id="btn-export" onclick="exportCSV()" disabled>⬇ CSV</button>
  </div>
</header>

<div id="setup">
  <h1>Ton <em>Tinder</em><br>du Cinéma</h1>
  <p>Swipe les films, récupère tes IDs TMDB en CSV.</p>

  <div class="setup-box">
    <div class="field">
      <label>Clé API TMDB (v3 ou token Bearer v4)</label>
      <input type="text" id="api-key" placeholder="9af7… ou eyJhbGci…" autocomplete="off"
             oninput="resetTest()">
    </div>

    <div class="field">
      <label>Exclure les films déjà vus (Fichier CSV)</label>
      <input type="file" id="csv-upload" accept=".csv" style="padding: 0.5rem; background: var(--bg3); border: 1px dashed #ffffff33; cursor: pointer;">
      <div id="csv-status" style="font-size: 0.75rem; color: var(--gold); margin-top: 0.4rem; text-align: right;"></div>
    </div>

    <div id="test-result"></div>

    <button class="btn-test" onclick="testKey()">🔌 Tester la connexion</button>

    <div class="field">
      <label>Langue des résultats</label>
      <select id="lang">
        <option value="fr-FR" selected>Français</option>
        <option value="en-US">English</option>
        <option value="es-ES">Español</option>
        <option value="de-DE">Deutsch</option>
        <option value="ja-JP">日本語</option>
      </select>
    </div>

    <div class="field">
      <label>Votes minimum (filtre films obscurs)</label>
      <div class="vote-row">
        <input type="range" id="min-votes" min="100" max="10000" step="100" value="1000"
               oninput="document.getElementById('vdisp').textContent=(+this.value).toLocaleString('fr-FR')">
        <span class="vote-val" id="vdisp">1 000</span>
      </div>
    </div>

    <button class="btn-start" id="btn-start" onclick="startApp()" disabled>🎬 Commencer</button>
  </div>

  <p class="hint">
    Clé sur <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org → API</a>
    &nbsp;·&nbsp; Rien ne quitte ton navigateur.
  </p>
</div>

<div id="app">
  <div class="card-stage">
    <div id="card-status">Chargement…</div>
  </div>

  <div class="action-row" id="action-row">
    <button class="btn-vote no" onclick="vote('no')">
      <div class="vote-circle">✕</div>
      <span class="vote-label">Pas pour moi</span>
      <span class="key-hint">← ou N</span>
    </button>
    <button class="btn-vote yes" onclick="vote('yes')">
      <div class="vote-circle">♥</div>
      <span class="vote-label">Je veux voir ça</span>
      <span class="key-hint">→ ou O</span>
    </button>
  </div>

  <div class="progress-line" id="prog">—</div>
</div>

<script>
const GENRES={28:'Action',12:'Aventure',16:'Animation',35:'Comédie',80:'Crime',99:'Documentaire',18:'Drame',10751:'Famille',14:'Fantaisie',36:'Histoire',27:'Horreur',10402:'Musique',9648:'Mystère',10749:'Romance',878:'Science-fiction',10770:'Téléfilm',53:'Thriller',10752:'Guerre',37:'Western'};

let API_KEY='',LANG='fr-FR',MIN_VOTES=1000;
let movies=[],idx=0,liked=[],page=1,totalPages=999,busy=false;
let alreadySeenIds = new Set(); // Stockage ultra-rapide des IDs exclus

/* ── AUTH ── */
function getHeaders(){
  const k=API_KEY.trim();
  if(k.startsWith('eyJ')) return{'Authorization':'Bearer '+k,'Content-Type':'application/json'};
  return{};
}
function addKey(url){
  const k=API_KEY.trim();
  if(!k.startsWith('eyJ')) return url+(url.includes('?')?'&':'?')+'api_key='+k;
  return url;
}
async function apiFetch(path,params={}){
  const qs=new URLSearchParams(params).toString();
  const url=addKey('https://api.themoviedb.org/3'+path+(qs?'?'+qs:''));
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),10000);
  try{
    const r=await fetch(url,{headers:getHeaders(),signal:ctrl.signal});
    clearTimeout(timer);
    const data=await r.json();
    if(!r.ok) throw new Error(data.status_message||'HTTP '+r.status);
    return data;
  }finally{clearTimeout(timer);}
}

/* ── TEST ── */
async function testKey(){
  const box=document.getElementById('test-result');
  API_KEY=document.getElementById('api-key').value.trim();
  if(!API_KEY){showTest('err','Entre ta clé d\'abord.');return;}
  box.style.display='block';box.className='';
  box.textContent='Test en cours…';
  try{
    const d=await apiFetch('/configuration');
    showTest('ok','✅ Connexion OK ! TMDB répond correctement.\nClique sur Commencer.');
    document.getElementById('btn-start').disabled=false;
  }catch(e){
    let msg='❌ Échec : '+e.message;
    if(e.name==='AbortError') msg='❌ Timeout — pas de réponse après 10s. Vérifie ta connexion internet.';
    else if(e.message.includes('Failed to fetch')||e.message.includes('NetworkError')||e.message.includes('CORS'))
      msg='❌ Erreur réseau / CORS.\nSi tu ouvres le fichier en local (file://), essaie de le servir via un petit serveur HTTP local.';
    showTest('err',msg);
  }
}

function showTest(type,msg){
  const box=document.getElementById('test-result');
  box.style.display='block';
  box.className=type;
  box.textContent=msg;
}

function resetTest(){
  const box=document.getElementById('test-result');
  box.style.display='none';
  document.getElementById('btn-start').disabled=true;
}

/* ── START ── */
function startApp(){
  LANG=document.getElementById('lang').value;
  MIN_VOTES=parseInt(document.getElementById('min-votes').value);
  movies=[];idx=0;liked=[];page=1;totalPages=999;busy=false;
  document.getElementById('liked-count').textContent='0';
  document.getElementById('btn-export').disabled=true;
  document.getElementById('setup').style.display='none';
  document.getElementById('app').style.display='flex';
  loadMore();
}

/* ── FETCH ── */
async function loadMore(){
  if(page>totalPages) return;
  try{
    const d=await apiFetch('/discover/movie',{
      language:LANG,
      sort_by:'popularity.desc',
      'vote_count.gte':MIN_VOTES,
      'vote_average.gte':4,
      page:page,
      include_adult:false
    });
    totalPages=Math.min(d.total_pages,500);
    
    // Filtrage des résultats par rapport au Set des IDs exclus
    const newMovies = d.results.filter(m => !alreadySeenIds.has(m.id));
    movies = movies.concat(newMovies);
    page++;

    // Sécurité : si l'API a renvoyé 20 films mais qu'ils étaient tous déjà vus,
    // on boucle immédiatement sur la page suivante pour ne pas bloquer l'interface.
    if (movies.length <= idx && page <= totalPages) {
      loadMore();
      return;
    }

    renderCard();
  }catch(e){
    setStatus('❌ '+e.message+'<br><button onclick="goBack()" style="margin-top:.5rem;background:var(--gold);color:#1a1408;border:none;border-radius:8px;padding:.4rem 1rem;cursor:pointer;font-size:.8rem">← Retour</button>');
  }
}

/* ── RENDER ── */
function setStatus(html){
  document.getElementById('card-status').innerHTML=html;
  document.getElementById('card-status').style.display='block';
}

function renderCard(){
  // remove old card
  document.querySelectorAll('.movie-card').forEach(c=>c.remove());

  if(idx>=movies.length){
    if(page<=totalPages){loadMore();return;}
    setStatus('🎞️ Plus de films !<br><span style="font-size:.78rem">Exporte ton CSV en haut.</span>');
    document.getElementById('action-row').style.opacity='.2';
    document.getElementById('action-row').style.pointerEvents='none';
    updateProg();return;
  }
  document.getElementById('card-status').style.display='none';

  const m=movies[idx];
  const poster=m.poster_path?'https://image.tmdb.org/t/p/w500'+m.poster_path:'';
  const genres=(m.genre_ids||[]).slice(0,3).map(id=>GENRES[id]).filter(Boolean);
  const year=(m.release_date||'').slice(0,4)||'—';
  const rating=m.vote_average?m.vote_average.toFixed(1):'—';
  const votes=m.vote_count?(+m.vote_count).toLocaleString('fr-FR'):'—';
  const overview=m.overview||'Aucun synopsis.';

  const card=document.createElement('div');
  card.className='movie-card anim-pop-in';
  card.innerHTML=`
    <div class="card-bg" style="background-image:url('${poster}');background-color:#1c1c2a"></div>
    <div class="card-fade"></div>
    <div class="vote-overlay yes">OUI</div>
    <div class="vote-overlay no">NON</div>
    <div class="card-body">
      <div class="card-genres">${genres.map(g=>`<span class="genre-tag">${g}</span>`).join('')}</div>
      <div class="card-title">${esc(m.title||m.original_title)}</div>
      <div class="card-meta">
        <span>${year}</span><span>·</span>
        <span class="star">★</span><span>${rating}</span>
        <span>·</span><span>${votes} votes</span>
      </div>
      <div class="card-overview">${esc(overview)}</div>
    </div>`;

  document.querySelector('.card-stage').appendChild(card);
  updateProg();
  if(idx>=movies.length-6&&page<=totalPages) loadMore();
}

/* ── VOTE ── */
function vote(choice){
  if(busy) return;
  if(idx>=movies.length) return;
  const card=document.querySelector('.movie-card');
  if(!card) return;
  busy=true;

  if(choice==='yes'){
    liked.push(movies[idx].id);
    document.getElementById('liked-count').textContent=liked.length;
    document.getElementById('btn-export').disabled=false;
    card.querySelector('.vote-overlay.yes').style.opacity='1';
    card.classList.add('anim-fly-right');
  } else {
    card.querySelector('.vote-overlay.no').style.opacity='1';
    card.classList.add('anim-fly-left');
  }
  idx++;
  setTimeout(()=>{busy=false;renderCard();},320);
}

/* ── CSV ── */
function exportCSV(){
  if(!liked.length) return;
  const csv='id\n'+liked.join('\n');
  const a=Object.assign(document.createElement('a'),{
    href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),
    download:'films_aimes_'+Date.now()+'.csv'
  });
  a.click();
}

function goBack(){
  document.getElementById('app').style.display='none';
  document.getElementById('setup').style.display='flex';
}

function updateProg(){
  document.getElementById('prog').textContent=`${idx} vus · ${liked.length} aimés · ~${movies.length} chargés`;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

document.addEventListener('keydown',e=>{
  if(document.getElementById('app').style.display==='none') return;
  if(e.key==='ArrowRight'||e.key==='o'||e.key==='O') vote('yes');
  if(e.key==='ArrowLeft' ||e.key==='n'||e.key==='N') vote('no');
});

/* ── LECTURE CSV EXCLUSION ── */
document.getElementById('csv-upload').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    const text = event.target.result;
    const lines = text.split('\n');
    alreadySeenIds.clear(); // Réinitialise en cas de nouveau fichier

    lines.forEach(line => {
      // Nettoie la ligne et convertit en entier (ignore la ligne d'en-tête "id")
      const id = parseInt(line.trim(), 10);
      if (!isNaN(id)) alreadySeenIds.add(id);
    });

    document.getElementById('csv-status').textContent = `✓ ${alreadySeenIds.size} films exclus chargés`;
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
